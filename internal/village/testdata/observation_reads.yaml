cases:
  - name: verified-stable-user-uuid
    method: user
    path: /api/v1/auth/me
    body: '{"id":"11111111-1111-4111-8111-111111111111","github_username":"renamed-user"}'
  - name: username-without-stable-id-refused
    method: user
    path: /api/v1/auth/me
    body: '{"github_username":"reused-name"}'
    invalid: true
  - name: foreign-viewer-dedicated-associations-only
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{"collectives":[{"id":"33333333-3333-4333-8333-333333333333","name":"visible","shared_at":"2026-01-01T00:00:00Z"}]}'
  - name: known-empty-complete-associations
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{"collectives":[]}'
  - name: missing-associations-not-empty
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{}'
    invalid: true
  - name: null-associations-not-empty
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{"collectives":null}'
    invalid: true
  - name: repeated-association-refused
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{"collectives":[{"id":"33333333-3333-4333-8333-333333333333","name":"visible","shared_at":"2026-01-01T00:00:00Z"},{"id":"33333333-3333-4333-8333-333333333333","name":"visible","shared_at":"2026-01-01T00:00:00Z"}]}'
    invalid: true
  - name: known-association-nondisclosure-preserves-status
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    status: 404
    body: '{"error":"unavailable"}'
    invalid: true
  - name: available-owned-pair-discovery
    method: submissions
    path: /api/v1/users/me/collectives/33333333-3333-4333-8333-333333333333/submissions
    body: '[{"group_id":"33333333-3333-4333-8333-333333333333","transcript_id":"22222222-2222-4222-8222-222222222222","event_num":1,"status":"pending","recorded_at":"2026-01-01T00:00:00Z"}]'
  - name: cross-collective-pair-refused
    method: submissions
    path: /api/v1/users/me/collectives/33333333-3333-4333-8333-333333333333/submissions
    body: '[{"group_id":"44444444-4444-4444-8444-444444444444","transcript_id":"22222222-2222-4222-8222-222222222222","event_num":1,"status":"pending","recorded_at":"2026-01-01T00:00:00Z"}]'
    invalid: true
  - name: unknown-submission-status-refused
    method: submissions
    path: /api/v1/users/me/collectives/33333333-3333-4333-8333-333333333333/submissions
    body: '[{"group_id":"33333333-3333-4333-8333-333333333333","transcript_id":"22222222-2222-4222-8222-222222222222","event_num":1,"status":"invented","recorded_at":"2026-01-01T00:00:00Z"}]'
    invalid: true
  - name: null-discovery-not-complete
    method: submissions
    path: /api/v1/users/me/collectives/33333333-3333-4333-8333-333333333333/submissions
    body: 'null'
    invalid: true
  - name: complete-known-empty-discovery
    method: submissions
    path: /api/v1/users/me/collectives/33333333-3333-4333-8333-333333333333/submissions
    body: '[]'
  - name: truncated-valid-json-prefix
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{"collectives":[]}'
    paddingBytes: 4194304
    invalid: true
  - name: trailing-second-json-document-refused
    method: associations
    path: /api/v1/transcripts/22222222-2222-4222-8222-222222222222/collectives
    body: '{"collectives":[]} {}'
    invalid: true
