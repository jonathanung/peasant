# Where the component tests hold the local shell manifest
# (scripts/visual/testdata/shell-chrome.yaml). The loader,
# src/test/fixtures/shellChromeCases.ts, requires every name below.
#
# pages: pathnames the sidebar must hold the manifest on — home, each
#   route-only section, a transcript, and the canonical /share route. (A
#   settings page swaps the nav for the settings sections; the sidebar test
#   covers it on its own.)
# paletteCapabilities: advertised capability sets the palette must hold the
#   manifest's palette rules under; the code-map token must not bring a
#   route-only section back.
pages:
  - name: home
    pathname: /
  - name: village
    pathname: /village/
  - name: analytics
    pathname: /analytics
  - name: changes
    pathname: /review/peasant
  - name: code-map
    pathname: /map/peasant
  - name: transcript
    pathname: /projects/peasant/sess-0001
  - name: share
    pathname: /share/
paletteCapabilities:
  - name: none
    tokens: []
  - name: code-map-token
    tokens:
      - code_map_navigation_v1
